<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05070d">
<meta name="description" content="마지막 성문의 수호자 v5.7 SD 벨트스크롤 액션 — 5인 전원 로비 출전·스킨 3벌(성문 전투복/다크 레드 연회복/정예 정복), SD 11파츠 관절 리깅, 3/4 시선 다프레임 방향 전환, 적 척후병·정예·보스 아르카논 관절 모션, 리아 협동(성광 협공·R), 스테이지·구역 웨이브">
<title>마지막 성문의 수호자 · v5.7 SD</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #05070d;
    font-family: "Noto Sans CJK KR", "Noto Sans KR", "Apple SD Gothic Neo", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
    overscroll-behavior: none;
  }
  #stage {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(120% 90% at 50% 40%, #0b1524 0%, #04060b 70%, #000 100%);
  }
  #game {
    display: block;
    touch-action: none;
    box-shadow: 0 0 60px rgba(40, 90, 160, 0.25), 0 0 0 1px rgba(120, 170, 230, 0.18);
    border-radius: 2px;
    background: #05070d;
  }
  /* 세로 화면 안내 */
  #rotate {
    position: fixed; inset: 0; z-index: 30;
    display: none;
    flex-direction: column; align-items: center; justify-content: center;
    gap: 18px;
    background: radial-gradient(circle at 50% 40%, #0d2035 0%, #04070d 75%);
    color: #dcecff; text-align: center; padding: 24px;
  }
  #rotate .phone {
    width: 92px; height: 152px; border-radius: 14px;
    border: 3px solid rgba(160, 210, 255, 0.85);
    position: relative;
    animation: tilt 2.2s ease-in-out infinite;
    box-shadow: 0 0 30px rgba(90, 160, 255, 0.35);
  }
  #rotate .phone::after {
    content: ''; position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%);
    width: 26px; height: 4px; border-radius: 2px; background: rgba(160, 210, 255, 0.6);
  }
  @keyframes tilt {
    0%, 40% { transform: rotate(0deg); }
    60%, 100% { transform: rotate(90deg); }
  }
  #rotate p { font-size: 20px; font-weight: 800; letter-spacing: 1px; }
  #rotate span { font-size: 13px; color: #7f9dbb; }
  @media (orientation: portrait) and (max-width: 900px) {
    #rotate { display: flex; }
  }
  #loading {
    position: fixed; inset: 0; z-index: 20;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    background: #04070d; color: #9dc4e8; font-size: 14px; letter-spacing: 2px;
    transition: opacity .5s ease;
  }
  #loading .bar { width: 220px; height: 3px; background: #12202f; border-radius: 2px; overflow: hidden; }
  #loading .bar i { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, #2f6bff, #9fd6ff); }
  #loading.hide { opacity: 0; pointer-events: none; }
  #err {
    position: fixed; left: 8px; bottom: 8px; z-index: 40; max-width: 70vw;
    font: 12px/1.5 ui-monospace, monospace; color: #ff9aa6;
    background: rgba(20, 0, 6, .85); border: 1px solid rgba(255, 90, 110, .5);
    padding: 8px 10px; border-radius: 6px; white-space: pre-wrap; display: none;
  }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="game"></canvas>
  </div>

  <div id="rotate">
    <div class="phone"></div>
    <p>화면을 가로로 돌려 주세요</p>
    <span>이 전투는 가로 화면(16:9)에 맞춰 제작되었습니다</span>
  </div>

  <div id="loading">
    <div>성문을 여는 중…</div>
    <div class="bar"><i id="loadbar"></i></div>
  </div>

  <div id="err"></div>

  <script src="vendor_pixi.min.js?v=5.7.1-build471&r=14"></script>
  <script src="js/util.js?v=5.7.1-build471&r=14"></script>
  <script src="js/stages.js?v=5.7.1-build471&r=14"></script>
  <script src="js/chars.js?v=5.7.1-build471&r=14"></script>
  <script src="js/rig.js?v=5.7.1-build471&r=14"></script>
  <script src="js/assets.js?v=5.7.1-build471&r=14"></script>
  <script src="js/audio.js?v=5.7.1-build471&r=14"></script>
  <script src="js/fx.js?v=5.7.1-build471&r=14"></script>
  <script src="js/scene.js?v=5.7.1-build471&r=14"></script>
  <script src="js/actors.js?v=5.7.1-build471&r=14"></script>
  <script src="js/hud.js?v=5.7.1-build471&r=14"></script>
  <script src="js/support.js?v=5.7.1-build471&r=14"></script>
  <script src="js/lobby.js?v=5.7.1-build471&r=14"></script>
  <script src="js/battle.js?v=5.7.1-build471&r=14"></script>
  <script src="js/main.js?v=5.7.1-build471&r=14"></script>
</body>
</html>
